name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.11"
          python-version: "3.14"
          enable-cache: true
      - name: Install locked core and development dependencies
        run: uv sync --locked --group dev
      - name: Lint and check formatting
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Run offline tests
        run: uv run --no-sync pytest
      - name: Build distributions
        run: uv build
      - name: Replay with the installed wheel outside the checkout
        run: |
          UV_PROJECT_ENVIRONMENT=/tmp/sweepflow-wheel uv sync --locked --no-dev --no-install-project
          uv pip install --python /tmp/sweepflow-wheel/bin/python --no-deps dist/*.whl
          cd /tmp
          /tmp/sweepflow-wheel/bin/sweepflow --help
          /tmp/sweepflow-wheel/bin/sweepflow replay "$GITHUB_WORKSPACE/examples/demo_1m.csv" --db /tmp/sweepflow-demo.sqlite
